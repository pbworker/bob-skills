      ### Backend Build Rules (Python FastAPI + Qiskit)

      **requirements.txt:** `fastapi, uvicorn[standard], pydantic, pydantic-settings, python-dotenv, numpy, scipy, faker, matplotlib`, `qiskit`, `qiskit-aer`, `qiskit-ibm-runtime`. (Keep versions current per the `ibm-qiskit` skill.)

      **config.py — Pydantic Settings:** `QUANTUM_MODE` = "local" (default) | "cloud"; `EXECUTION_TARGET` default "local-ideal"; `IBM_QUANTUM_API_KEY`, `IBM_QUANTUM_CRN`, `IBM_QUANTUM_CHANNEL="ibm_quantum_platform"` (all optional); `DEFAULT_SHOTS`, `ALLOW_PAID_QPU` (default False — a real-QPU submit is refused unless explicitly true), CORS origins.

      **quantum_service.py — tri-mode execution (invoke the `ibm-qiskit` skill for the exact APIs):**
      - `build(instance, algorithm)` → returns the abstract `QuantumCircuit`(s) + any `SparsePauliOp` observables (the Map step). Lives in `algorithms/<algo>.py`.
      - `transpile(circuit, target)` → `generate_preset_pass_manager(backend=<selected>, optimization_level=1).run(circuit)`; for estimator workloads also `apply_layout` the observables.
      - `run(instance, algorithm, target, shots)`:
        - `local-ideal` → `qiskit.primitives.StatevectorSampler/Estimator` or `AerSimulator(method="statevector")`.
        - `local-noisy` → `AerSimulator.from_backend(FakeBackendV2())` (a `qiskit_ibm_runtime.fake_provider` device).
        - `cloud-qpu` → ONLY if `ALLOW_PAID_QPU` is true AND the request carries explicit confirmation: `QiskitRuntimeService(channel, token, instance)` → `least_busy(...)` → `SamplerV2/EstimatorV2(mode=backend)` → return `job_id` and poll. Otherwise return a 412/clear error telling the caller to confirm cost.
      - Always return: `{ counts | evs, circuit_image, isa_depth, op_counts, backend_name, shots, job_id?, mode }`.
      - On any cloud error, surface it honestly; do NOT silently fabricate results. (You MAY offer to fall back to `local-noisy` with a clear note.)
      - V2 primitives only; Sampler circuits have measurements, Estimator circuits don't; little-endian counts.

      **classical_baseline.py:** the exact/brute-force answer at the demo's small size (e.g. NumPy eigensolver for VQE ground state, brute-force enumeration for Max-Cut/portfolio, trial division for Shor's target) — so every result is shown next to the classical truth.

      **synthetic_instance_service.py — Faker seed=42:** generate synthetic, fictional problem instances (molecule geometries from a small fixed set; N assets with returns/covariance; random optimization graphs; small integers to factor). Fictional company/asset names (Apex, NovaTech, BlueLine, Meridian, Greenfield, Pinnacle, Atlas, Quantum Telecom, Brightpath, Ironbridge). No real tickers, no real molecules tied to a client, no PII.

      **Routers:**
      - health.py: `GET /api/health` → `{status, mode, target, qiskit_version, disclaimer}`
      - problem.py: `GET /api/problem/instances`, `GET /api/problem/{id}` (instance + classical baseline)
      - quantum.py: `POST /api/quantum/build`, `POST /api/quantum/transpile`, `POST /api/quantum/run` (body includes `target` + `confirm_paid` for cloud), `GET /api/quantum/backends`, `GET /api/quantum/result/{job_id}`

