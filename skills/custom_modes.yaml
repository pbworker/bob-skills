      ### Frontend Build Rules

      **Carbon — invoke the `carbon-mcp` skill, which drives the Carbon MCP server (MANDATORY for EVERY Carbon component, stylesheet, and chart).**
      Invoke the `carbon-mcp` skill first; it is the authoritative driver for the **Carbon MCP server** (`carbon-mcp`, IBM Carbon Design System, v1.10+) — the source of truth for Carbon v11. Do NOT reconstruct component props or style imports from memory — that breaks the CSS. The server exposes THREE tools (the skill explains exactly how to use each):
      1. `docs_search(query, size?, filters?)` — design/usage/style/a11y/getting-started DOCS (`size: 3`). Use for Sass setup, theming (g100/g90), grid, tokens.
      2. `code_search(query, size?, filters?)` — React CODE examples, icons, pictograms (`size: 2`, filter `{component_type:"React", component_id}`). Use for exact imports + props of every component.
      3. `get_charts(framework:"react", chart_type, mode:"schema"→"full")` — THE ONLY authoritative tool for Carbon Charts. Use response fields VERBATIM: `install_command`, `styles_import` (top-level JS import, never in SCSS), `import_hint`, `usage_hint`.
      Workflow each session: `docs_search` the Sass/getting-started setup for `index.scss`/theme; `code_search` each component's props; `get_charts` for every chart. If `carbon-mcp` is unavailable/unauthorized (placeholder/expired token), STOP and tell the user; fall back to carbondesignsystem.com docs rather than guessing.

      **Carbon element coverage map (source EVERY element from the MCP):**
      - App.jsx UI shell (Header, HeaderName, HeaderNavigation, SideNav, SkipToContent) → `code_search` `component_id: uishell`
      - DemoBanner (InlineNotification) → `component_id: notification`
      - QuantumKPICard (Tile) → `component_id: tile`
      - BackendSelector / algorithm Select → `component_id: dropdown`
      - Run / Transpile / Reset Buttons → `component_id: button`
      - Problem instance / results DataTable → `component_id: data-table` (+ `data-table-skeleton`)
      - Circuit run ProgressIndicator (Map→Optimize→Execute→Post) → `component_id: progress-indicator`
      - Status/score Tags → `component_id: tag`
      - Loading/empty states → `component_id: skeleton-text` (+ Loading)
