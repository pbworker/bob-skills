      # ===== INDUSTRY TEMPLATES =====

      ## Healthcare & Pharmaceuticals
      Use cases: drug-candidate screening, molecular ground-state energy, reaction simulation, materials for delivery.
      Approach: VQE (ground state), Hamiltonian dynamics. Instance: H2/LiH/H2O qubit Hamiltonian. Baseline: exact diagonalization (NumPy). Terms: ansatz, ground state, Hartree-Fock, electronic structure. Scope: small molecules on NISQ; drug-scale needs fault-tolerance.

      ## Finance & Banking
      Use cases: portfolio optimization, risk/VaR, derivative pricing, fraud-pattern sampling.
      Approach: QAOA (portfolio QUBO), amplitude estimation (pricing/risk). Instance: N synthetic assets + covariance. Baseline: brute-force optimum / Monte Carlo. Terms: QUBO, Ising, efficient frontier, expectation value. Scope: small N; heuristic, advantage unproven vs classical optimizers.

      ## Logistics & Manufacturing
      Use cases: vehicle routing, fleet/job-shop scheduling, network design.
      Approach: QAOA on Max-Cut/TSP/scheduling Ising. Instance: synthetic seeded graph. Baseline: brute force / OR-Tools at small size. Terms: combinatorial optimization, QUBO, mixer/cost layers. Scope: small instances; classical solvers win at production scale today.

      ## Energy & Climate
      Use cases: battery/solar materials discovery, smart-grid optimization, unit commitment.
      Approach: VQE (materials chemistry), QAOA (grid optimization). Instance: small material Hamiltonian or grid graph. Baseline: exact / classical optimizer. Terms: electronic structure, unit commitment. Scope: same NISQ caveats.

      ## Cybersecurity
      Use cases: quantum threat awareness, quantum-safe transition.
      Approach: Shor (factoring threat), Grover (search speedup), BB84 (QKD concept) — all on a simulator. Instance: small integer to factor / marked item / key-exchange demo. Baseline: classical factoring/search at that size. Terms: Shor, Grover, QKD, "harvest now, decrypt later". **Scope/honesty: Qiskit shows the THREAT and QKD; the DEFENSE is classical PQC (ML-KEM/ML-DSA), which is NOT Qiskit — present them as complementary, never conflate.**


      # ===== BUILD VERIFICATION & SELF-TEST (MANDATORY — run before handover) =====
      Generating code is HALF the job. Run what you build, observe it working, fix your own errors in-session.

      ## The build → run → read-errors → fix loop (repeat until green, ~5 attempts/stage)

      ### Stage 1 — Quantum kernel runs LOCALLY and the physics is correct
      - In a venv, `pip install -r backend/requirements.txt`.
      - Run the kernel directly (a tiny script or `python -c`) on `local-ideal` and assert KNOWN physics: a Bell/GHZ test gives ~50/50 over the all-0/all-1 strings (only those); a VQE energy converges near the exact diagonalization value; a Max-Cut QAOA's best bitstring matches the brute-force optimum at the demo size. If the physics is wrong, the circuit/operator is wrong — fix it (use the `ibm-qiskit` skill), don't proceed.
      - Run once more on `local-noisy` and confirm it still completes and is close (with visible noise).

      ### Stage 2 — Backend boots and serves
      - Boot uvicorn (run_in_background). `curl -fsS /api/health` → 200 + `{status, mode, target}`. Hit `/api/problem/instances`, `/api/quantum/build`, and `POST /api/quantum/run` (target=local-ideal) → 200 with counts/evs + circuit image. Confirm it runs with ZERO IBM Quantum credentials.
      - If cloud config is present, verify `GET /api/quantum/backends` lists real QPUs (key↔CRN match) — but DO NOT submit a paid job in verification.

      ### Stage 3 — Frontend builds (catches Carbon CSS breakage cheaply)
      - `cd frontend && (npm ci || npm install)`; fix missing deps (`sass`, `@carbon/*`, `@carbon/charts`). `npm run build` MUST exit 0. On any error re-query `carbon-mcp` for the correct import/prop/Sass setup, fix, rebuild.

      ### Stage 4 — App runs and renders (visual + console verification)
      - Boot the dev/preview server with the backend up; load ALL routes (`/`, `/problem`, `/circuit`, `/run`, `/results`, `/architecture`) with the browser tooling.
      - Per route: capture the browser console, assert ZERO uncaught errors and no failed CSS/asset requests; screenshot. Carbon must be visibly STYLED (IBM Plex, g100 theme, grid) — not raw HTML.
      - Exercise the wow moment: trigger a preset instance on RunPage → confirm the circuit renders, `local-ideal` run returns a histogram (and convergence chart for VQE/QAOA) with no console errors, and the ResultsPage shows the quantum-vs-classical comparison.

      ### Stage 5 — Containers (only if you built Dockerfiles)
      - At minimum `docker/podman build` each image (use `--platform linux/amd64` for arm64→amd64 targets). A failed image build is a HARD FAIL.

      ## Real-QPU runs in a demo (optional, gated)
      Submitting to a real QPU is NOT part of automated verification (it costs and queues). Only do it when the user has approved cost AND `ALLOW_PAID_QPU=true`: then run once, capture the `job_id` + histogram, and store it as the demo's backup evidence. State the cost/runtime before submitting and report the job ID after.

      ## What "verified" means (report honestly)
      Only claim done when: the kernel runs locally and matches the classical/known answer; backend health + `/api/quantum/run` (local-ideal) return 200 with zero credentials; `npm run build` exits 0; all pages load with zero console errors and visibly-correct Carbon styling (screenshots captured); the wow moment renders a real histogram. Report status plainly — "built, runs locally, physics verified vs classical baseline (screenshots attached)" — or the exact failing stage. A demo that has not completed Stages 1–4 is NOT done.


