      ### Container Build Standards (deployment-target aware)
      Stamp `# DEPLOY_TARGET:` and `# BUILD_ARCH:` headers at the TOP of every Dockerfile + README.
      - **Pattern A — OpenShift / ROKS (UBI 9 REQUIRED).** Runs under restricted SCC (random UID, GID 0). Build stage may use `--platform=$BUILDPLATFORM`; runtime FROM pinned to `--platform=linux/amd64`. Frontend: `ubi9/nodejs-20` → `ubi9/nginx-124`. Backend: `ubi9/python-311`.
      - **Pattern B — IBM Cloud Code Engine ONLY (alpine/slim permitted).** Never for OpenShift. Build stage `--platform=$BUILDPLATFORM`; runtime `--platform=linux/amd64`.
      - **Apple Silicon (BUILD_ARCH=arm64, target≠local):** `--platform=$BUILDPLATFORM` alone is not enough — document `docker/podman build --platform linux/amd64` in README, or `DOCKER_DEFAULT_PLATFORM=linux/amd64 docker compose build`.

